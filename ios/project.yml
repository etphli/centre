name: Centre
options:
  bundleIdPrefix: app.centre
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  CentreCore:
    path: .
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.0.0
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Centre:
    type: application
    platform: iOS
    sources: [CentreApp]
    info:
      path: CentreApp/Info.plist
      properties:
        CFBundleDisplayName: Centre
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CentreCloudURL: $(CENTRE_CLOUD_URL)
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        GIDServerClientID: $(GOOGLE_SERVER_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: app.centre.pairing
            CFBundleURLSchemes: [centre]
          - CFBundleURLName: app.centre.google
            CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.centre.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: CentreCore
      - package: GoogleSignIn
        product: GoogleSignIn
  CentreUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CentreUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.centre.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Centre
schemes:
  Centre:
    build:
      targets:
        Centre: all
        CentreUITests: [test]
    test:
      targets: [CentreUITests]
      gatherCoverageData: false
